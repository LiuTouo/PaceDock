[package]
name = "d3d9-workload"
version = "0.1.0"
edition = "2021"
description = "PaceDock GPU 基準測試的 Direct3D9 workload（黑/白交替、無 vsync、不設上限）"

[dependencies]
windows = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Graphics_Direct3D9",
    "Win32_Graphics_Gdi",
    "Win32_System_LibraryLoader",
    "Win32_System_Threading",
    "Win32_UI_WindowsAndMessaging",
] }

[profile.release]
opt-level = 3
panic = "abort"
strip = true
