name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: 驗證版本一致性
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $tag = "$env:GITHUB_REF_NAME"

          if ($tag -notmatch '^v(\d+)\.(\d+)\.(\d+)$') {
            Write-Error "標籤 '$tag' 不符合語意化版本格式 vX.Y.Z"
            exit 1
          }

          $version = $tag.Substring(1)

          $pkg = Get-Content package.json -Raw | ConvertFrom-Json
          if ($pkg.version -ne $version) {
            Write-Error "package.json 版本 $($pkg.version) 與標籤版本 $version 不一致"
            exit 1
          }

          $lock = Get-Content package-lock.json -Raw | ConvertFrom-Json -AsHashtable
          if ($lock['version'] -ne $version) {
            Write-Error "package-lock.json 版本 $($lock['version']) 與標籤版本 $version 不一致"
            exit 1
          }
          if ($lock['packages'] -and $lock['packages']['']) {
            $lockRoot = $lock['packages']['']
            if ($lockRoot['version'] -ne $version) {
              Write-Error "package-lock.json packages[\"\"] 版本 $($lockRoot['version']) 與標籤版本 $version 不一致"
              exit 1
            }
          }

          $cargoToml = Get-Content src-tauri/Cargo.toml -Raw
          if ($cargoToml -match 'version\s*=\s*"([^"]+)"') {
            $cargoVersion = $Matches[1]
            if ($cargoVersion -ne $version) {
              Write-Error "src-tauri/Cargo.toml 版本 $cargoVersion 與標籤版本 $version 不一致"
              exit 1
            }
          } else {
            Write-Error "無法從 src-tauri/Cargo.toml 解析版本"
            exit 1
          }

          $tauriConf = Get-Content src-tauri/tauri.conf.json -Raw | ConvertFrom-Json
          if ($tauriConf.version -ne $version) {
            Write-Error "src-tauri/tauri.conf.json 版本 $($tauriConf.version) 與標籤版本 $version 不一致"
            exit 1
          }

          Write-Host "版本驗證通過：$version"

      - name: 驗證 updater 簽署金鑰
        shell: pwsh
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          $ErrorActionPreference = "Stop"

          # pubkey 必須已從 placeholder 替換為真正的公鑰
          $tauriConf = Get-Content src-tauri/tauri.conf.json -Raw | ConvertFrom-Json
          $pubkey = $tauriConf.plugins.updater.pubkey
          if ($pubkey -eq "REPLACE_ME_WITH_YOUR_PUBLIC_KEY_BASE64") {
            Write-Error "updater 公鑰仍為 placeholder 'REPLACE_ME_WITH_YOUR_PUBLIC_KEY_BASE64'。"
            Write-Error "請先產生簽署金鑰組：npm run tauri signer generate -- -w src-tauri"
            Write-Error "此命令會在 src-tauri 目錄產生私鑰檔案（不可提交至版本控制）與公鑰字串（寫入 tauri.conf.json plugins.updater.pubkey）。"
            Write-Error "將私鑰內容設為 GitHub Actions secret TAURI_SIGNING_PRIVATE_KEY。若私鑰有密碼保護，另設 TAURI_SIGNING_PRIVATE_KEY_PASSWORD。"
            exit 1
          }

          # 私鑰必須存在
          if (-not $env:TAURI_SIGNING_PRIVATE_KEY) {
            Write-Error "GitHub Actions secret TAURI_SIGNING_PRIVATE_KEY 未設定。"
            Write-Error "請用 npm run tauri signer generate -- -w src-tauri 產生簽署金鑰組，然後將私鑰內容設定為此 repository 的 Actions secret TAURI_SIGNING_PRIVATE_KEY。"
            exit 1
          }

          Write-Host "updater 簽署設定驗證通過"

      - name: 安裝前端相依套件
        run: npm ci

      - name: 前端型別檢查
        run: npm run check

      - name: npm 相依安全性稽核
        run: npm audit

      - name: Rust 測試
        run: cargo test --manifest-path src-tauri/Cargo.toml

      - name: Rust Clippy（warnings 視為錯誤）
        run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets --all-features -- -D warnings

      - name: 建置 NSIS 安裝程式與 updater artifacts
        # pin 到完整 commit SHA（v1）— 此 step 接觸 GITHUB_TOKEN 與 updater
        # signing key，不可使用可移動 tag。升級改 SHA 需人工 review。
        uses: tauri-apps/tauri-action@1deb371b0cd8bd54025b384f1cd735e725c4060f
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD || '' }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "PaceDock ${{ github.ref_name }}"
          releaseDraft: false
          prerelease: false
          generateReleaseNotes: true
          uploadUpdaterJson: true

      - name: 建立可攜版 ZIP
        shell: pwsh
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD || '' }}
        run: |
          $ErrorActionPreference = "Stop"

          $version = "$env:GITHUB_REF_NAME".Substring(1)
          $exeDir = "src-tauri/target/release"
          $exeName = "PaceDock.exe"
          $zipName = "PaceDock_$($version)_x64-portable.zip"
          $stagingDir = "portable-staging"

          if (-not (Test-Path "$exeDir\$exeName")) {
            Write-Error "找不到 $exeDir\$exeName"
            exit 1
          }

          # 建立暫存目錄，複製 exe 與標記檔
          New-Item -ItemType Directory -Force -Path $stagingDir | Out-Null
          Copy-Item "$exeDir\$exeName" "$stagingDir\" -Force
          # 可攜版標記檔：空檔案，表示此為可攜版
          New-Item -ItemType File -Path "$stagingDir\.pacedock-portable" -Force | Out-Null

          # 基準測試資源：可攜版必須內含（resource_dir() = exe 所在目錄 → resources\benchmark）
          $resourceDir = "$exeDir\resources\benchmark"
          if (Test-Path $resourceDir) {
            New-Item -ItemType Directory -Force -Path "$stagingDir\resources\benchmark" | Out-Null
            Copy-Item "$resourceDir\*" "$stagingDir\resources\benchmark\" -Force -Recurse
            Write-Host "已複製基準測試資源到可攜版"
          } else {
            Write-Error "找不到基準測試資源目錄 $resourceDir（可攜版將缺少 benchmark 工具）"
            exit 1
          }

          # 打包 ZIP：明確指定輸入路徑（不依賴萬用字元包含 dotfile）
          Compress-Archive -Path "$stagingDir\$exeName", "$stagingDir\.pacedock-portable", "$stagingDir\resources" -DestinationPath $zipName -Force

          # 驗證 ZIP 內含 exe、標記檔與六個必要資源項目。
          # FullName 分隔符正規化為 /，逐一比對，缺任一項即失敗。
          $requiredEntries = @(
            'PaceDock.exe',
            '.pacedock-portable',
            'resources/benchmark/PresentMon-2.5.1-x64.exe',
            'resources/benchmark/lava-triangle.exe',
            'resources/benchmark/d3d9-workload.exe',
            'resources/benchmark/LICENSE-PresentMon.txt',
            'resources/benchmark/LICENSE-liblava.txt',
            'resources/benchmark/SHA256SUMS'
          )
          $zipArchive = [System.IO.Compression.ZipFile]::OpenRead("$pwd\$zipName")
          try {
            $fullNames = @($zipArchive.Entries.FullName) | ForEach-Object { $_ -replace '\\', '/' }
          } finally {
            $zipArchive.Dispose()
          }
          foreach ($entry in $requiredEntries) {
            if ($fullNames -notcontains $entry) {
              Write-Error "可攜版 ZIP 中缺少必要項目: $entry"
              exit 1
            }
            Write-Host "已確認 ZIP 內含: $entry"
          }
          Write-Host "已確認 ZIP 內含全部必要項目"

          Write-Host "可攜版 ZIP 已建立：$zipName"
          Write-Host "size=$((Get-Item $zipName).Length)"

          # 計算 SHA256
          $sha256 = (Get-FileHash -Path $zipName -Algorithm SHA256).Hash.ToLower()
          "$sha256  $zipName" | Out-File -FilePath "$zipName.sha256" -Encoding utf8NoBOM
          Write-Host "SHA256: $sha256"

          # publisher 簽章：以 updater 簽署 key 簽署 metadata（綁 version/asset/sha256）。
          # 可攜版 client 以內嵌 public key 驗證，缺簽章即拒絕更新（同一信任根。
          # TAURI_SIGNING_PRIVATE_KEY 需以 base64 編碼的 key 內容提供）。
          $tag = "$env:GITHUB_REF_NAME"
          $meta = [ordered]@{
            schema  = 1
            version = $tag.Substring(1)
            asset   = $zipName
            sha256  = $sha256
          } | ConvertTo-Json -Compress
          [System.IO.File]::WriteAllText("$pwd\$zipName.update.json", $meta)
          npx tauri signer sign "$zipName.update.json"
          if (-not (Test-Path "$zipName.update.json.sig")) {
            Write-Error "portable update metadata 簽章失敗"
            exit 1
          }
          Write-Host "portable update metadata 已簽署"

          # 清理暫存
          Remove-Item -Recurse -Force $stagingDir

          # 輸出變數供後續步驟使用
          "zipName=$zipName" >> $env:GITHUB_ENV

      - name: 上傳可攜版至 GitHub Release
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $zipName = "$env:zipName"
          $tag = "$env:GITHUB_REF_NAME"

          if (-not $zipName) {
            Write-Error "zipName 環境變數未設定"
            exit 1
          }

          if (-not (Test-Path $zipName)) {
            Write-Error "找不到 $zipName"
            exit 1
          }
          if (-not (Test-Path "$zipName.sha256")) {
            Write-Error "找不到 $zipName.sha256"
            exit 1
          }
          if (-not (Test-Path "$zipName.update.json") -or -not (Test-Path "$zipName.update.json.sig")) {
            Write-Error "找不到 $zipName.update.json(.sig)— 可攜版必須附 publisher 簽章"
            exit 1
          }

          gh release upload $tag $zipName "$zipName.sha256" "$zipName.update.json" "$zipName.update.json.sig" --clobber
          Write-Host "已上傳可攜版資產：$zipName, $zipName.sha256, $zipName.update.json(.sig)"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD || '' }}

      - name: 計算 NSIS 安裝程式 SHA256 並上傳穩定命名資產
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $tag = "$env:GITHUB_REF_NAME"
          $version = $tag.Substring(1)
          $expectedName = "PaceDock_$($version)_x64-setup.exe"

          # tauri-action 建置輸出在標準 Tauri bundle 路徑
          $bundleDir = "src-tauri\target\release\bundle\nsis"
          $installer = Get-ChildItem -Path $bundleDir -Filter "*.exe" -ErrorAction SilentlyContinue |
              Where-Object { $_.Name -like "PaceDock*setup*" } |
              Select-Object -First 1

          if (-not $installer) {
            Write-Error "在 $bundleDir 中找不到 NSIS 安裝程式（預期 $expectedName）"
            exit 1
          }

          Write-Host "找到 NSIS 安裝程式：$($installer.FullName)"

          # 計算 SHA256
          $sha256 = (Get-FileHash -Path $installer.FullName -Algorithm SHA256).Hash.ToLower()
          "$sha256  $expectedName" | Out-File -FilePath "$expectedName.sha256" -Encoding utf8NoBOM
          Write-Host "NSIS SHA256: $sha256"

          # 上傳 checksum
          gh release upload $tag "$expectedName.sha256" --clobber
          Write-Host "已上傳安裝程式校驗檔：$expectedName.sha256"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
